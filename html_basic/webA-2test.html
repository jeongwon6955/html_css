<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .wrap {
            width: 800px;
            height: 600px;
            margin: 0 auto;
        }
        .container {
            width: 100%;
            height: 100%;
            position: relative;
            border: 3px solid black;
        }
        .bed1 {
            width: 350px;
            height: 200px;
            position: absolute;
            top: 320px;
            right: 0;
            border-left: 3px solid black;
            border-top: 3px solid black;
            text-align: center;
            line-height: 200px;
        }
        .bed2 {
            width: 280px;
            height: 330px;
            position: absolute;
            left: 0;
            top: 0;
        }
        .bed2-1 {
            width: 100%;
            height: 250px;
            border-right: 3px solid black;
            border-bottom: 3px solid black;
            text-align: center;
            line-height: 250px;
        }
        .bed2-2 {
            width: 100px;
            height: 80px;
            border-right: 3px solid black;
            border-bottom: 3px solid black;
            text-align: center;
            line-height: 80px;
        }
        .bed3 {
            width: 280px;
            height: 320px;
            position: absolute;
            right: 0;
            border-left: 3px solid black;
        }
        .bed3-1 {
            height: 30%;
            border-bottom: 3px solid black;
            text-align: center;
            line-height: 100px;
        }
        .bed3-2 {
            height: 40%;
            border-bottom: 3px solid black;
            text-align: center;
            line-height: 120px;
        }
        .bed3-3 {
            height: 30%;
            display: flex;
            text-align: center;
            line-height: 100px;
        }
        .box1 {
            width: 150px;
            height: 100%;
            border-right: 3px solid black;
        }
        .box2 {
            width: 100px;
            height: 100%;
        }
        .h1-1 {
            position: absolute;
            left: 380px;
            top: 50px;
        }
        .h1-2 {
            position: absolute;
            left: 200px;
            top: 370px;
        }
        .footer {
            width: 100%;
            height: 80px;
            border-top: 3px solid black;
            position: absolute;
            top: 520px;
            text-align: center;
            line-height: 80px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="container">
            <div class="content">
                <h2 class="h1-1">주방</h2>
                <h2 class="h1-2">거실</h2>
                <div class="bed1">
                    <h2>침실1</h2>
                </div>
                <div class="bed2">
                    <div class="bed2-1">
                        <h2>침실2</h2>
                    </div>
                    <div class="bed2-2">
                        <h2>현관</h2>
                    </div>
                </div>
                <div class="bed3">
                    <div class="bed3-1">
                        <h2>다용도실</h2>
                    </div>
                    <div class="bed3-2">
                        <h2>침실3</h2>
                    </div>
                    <div class="bed3-3">
                        <div class="box1">
                            <h2>욕실1</h2>
                        </div>
                        <div class="box2">
                            <h2>욕실2</h2>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <h2>발코니</h2>
            </div>
        </div>
    </div>
</body>
</html>
