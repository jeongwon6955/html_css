<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        .wrap {
            width: 1200px;
            margin: 0 auto;
        }
        .header {
            width: 100%;
            display: flex;
        }
        .logo {
            width: 20%;
            height: 100px;
            background-color: red;
        }
        .nav {
            width: 80%;
            height: 100px;
            background-color: blue;
        }
        .slide {
            width: 100%;
            height: 300px;
            background-color: black;
        }
        .content {
            width: 100%;
            display: flex;
        }
        .content1 {
            width: 33.33%;
            height: 200px;
            background-color: aliceblue;
        }
        .content2 {
            width: 33.33%;
            height: 200px;
            background-color: aqua;
        }
        .content3 {
            width: 33.33%;
            height: 200px;
            background-color: aquamarine;
        }
        .footer {
            width: 100%;
            display: flex;
        }
        .footer1 {
            width: 20%;
            height: 100px;
            background-color: blueviolet;
        }
        .footer2 {
            width: 60%;
            height: 100px;
            background-color: brown;
        }
        .footer3 {
            width: 20%;
            height: 100px;
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="logo"></div>
            <div class="nav"></div>
        </div>
        <div class="slide"></div>
        <div class="content">
            <div class="content1"></div>
            <div class="content2"></div>
            <div class="content3"></div>
        </div>
        <div class="footer">
            <div class="footer1"></div>
            <div class="footer2"></div>
            <div class="footer3"></div>
        </div>
    </div>
</body>
</html>
