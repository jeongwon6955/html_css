<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .wrap {
            width: 100%;
        }
        .main {
            width: 100%;
            height: calc(100vh - 80px);
            display: flex;
        }
        .header {
            width: 150px;
            height: 100%;
        }
        .logo {
            width: 100%;
            height: 10%;
            background-color: peachpuff;
        }
        .nav {
            width: 100%;
            height: 90%;
            background-color: black;
        }
        .contents {
            width: 400px;
            height: 100%;
        }
        .box1 {
            width: 100%;
            height: 15%;
            background-color: coral;
        }
        .box2 {
            width: 100%;
            height: 35%;
            background-color: pink;
        }
        .box3 {
            width: 100%;
            height: 35%;
            background-color: plum;
        }
        .box4 {
            width: 100%;
            height: 15%;
            background-color: skyblue;
        }
        .slider {
            /* width: 600px; */
            width: calc(600px - 550px);
            height: 100%;
            background-color: peachpuff;
        }
        .footer {
            width: 100%;
            display: flex;
        }
        .footer1 {
            width: 150px;
            height: 80px;
            background-color: peachpuff;
        }
        .footer2 {
            width: calc(100% - 100px);
            height: 80px;
        }
        .footer2-1 {
            width: 100%;
            height: 50%;
            background-color: black;
        }
        .footer2-2 {
            width: 100%;
            height: 50%;
            background-color: darkgray;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="main">
            <div class="header">
                <div class="logo"></div>
                <div class="nav"></div>
            </div>
            <div class="contents">
                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>
                <div class="box4"></div>
            </div>
            <div class="slider"></div>
        </div>
        <div class="footer">
            <div class="footer1"></div>
            <div class="footer2">
                <div class="footer2-1"></div>
                <div class="footer2-2"></div>
            </div>
        </div>
    </div>
</body>
</html>
