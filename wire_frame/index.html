<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건물구조</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            width: 1200px;
            height: 700px;
            margin: auto;
            border: 1px solid black;
        }
        .header {
            width: 100%;
            height: 100px;
            text-align: center;
            font-size: 30px;
            line-height: 100px;
            border-bottom: 1px solid black;
        }
        .slider {
            height: 600px;
            position: relative;
        }
        .box2 {
            width: 400px;
            height: 300px;
            text-align: center;
            font-size: 30px;
            line-height: 300px;
            border-bottom: 1px solid black;
            border-right: 1px solid black;
        }
        .box3 {
            width: 375px;
            height: 300px;
            text-align: center;
            font-size: 30px;
            line-height: 300px;
            border-right: 1px solid black;
        }
        .box4 {
            position: absolute;
            right: 0;
            top: 0;
            width: 350px;
            height: 250px;
            text-align: center;
            font-size: 30px;
            line-height: 250px;
            border-left: 1px solid black;
            border-bottom: 1px solid black;
        }
        .box5 {
            position: absolute;
            top: 250px;
            right: 0;
            width: 300px;
            height: 100px;
            text-align: center;
            font-size: 30px;
            line-height: 100px;
            border-left: 1px solid black;
        }
        .box6 {
            position: absolute;
            top: 350px;
            right: 0;
            width: 325px;
            height: 250px;
            text-align: center;
            font-size: 30px;
            line-height: 250px;
            border-top: 1px solid black;
            border-left: 1px solid black;
        }
        .box7 {
            position: absolute;
            bottom: 0;
            right: 450px;
            width: 300px;
            height: 100px;
            text-align: center;
            font-size: 30px;
            line-height: 100px;
            border-top: 1px solid black;
            border-left: 1px solid black;
            border-right: 1px solid black;
        }
        .box8 {
            position: absolute;
            top: 15px;
            right: 550px;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <p>베란다</p>
        </div>
        <div class="slider">
            <div class="box2">
                <p>안방</p>
            </div>
            <div class="box3">
                <p>부엌</p>                
            </div>
            <div class="box4">
                <p>작은방1</p>
            </div>
            <div class="box5">
                <p>화장실</p>
            </div>
            <div class="box6">
                <p>작은방2</p>
            </div>
            <div class="box7">
                <p>현관</p>
            </div>
            <div class="box8">
                <p>거실</p>
            </div>
        </div>
    </div>
</body>
</html>
