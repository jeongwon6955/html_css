<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div>
        <div class="header">
            <nav>
                <img src="https://humic.co.kr/assets/images/main/logo-color.png
                " alt="" style="width: 150px; height: 40px;">
                <ul class="menu">
                    <li><a href="#">병원소개</a></li>
                    <li><a href="#">휴먼영상의학센터</a></li>
                    <li><a href="#">휴먼영상시술센터</a></li>
                    <li><a href="#">커뮤니티</a></li>
                    <li><a href="#">비급여항목</a></li>
                    <li><a href="#">예약 및 상담</a></li>
                    <div class="user">
                        <div class="box">
                        <p>로그인</p>
                        </div>
                        <p style="font-size: 30px; height: 32px; line-height: 25px; color: white;">=</p>
                    </div>
                </ul>
            </nav>
        </div>
        <img src="https://humic.co.kr/upload/banner/202412/1734331261_m0173053_20241216154101.JPG
        " alt="" style="width: 100%; height: 900px;">
        <div class="box1">
            <div class="container">
                <p style="color: white; opacity: 0.6; font-size: 20px; margin-top: 20px; position: absolute; top: 5px;">Human Medical Imaging & Intervention Center</p>
                <h2 style="height: 180px; font-size: 70px; width: 850px; color: white; position: absolute; top: 45px;">각 분야별 세부 전공 영상의학 전문의 150여명 근무</h2>
            </div>
        </div>
        <div class="box2">
            <div class="box2-1">
                <h2 style="color: white; text-align: center; font-size: 28px; margin-bottom: 20px;">진료 상담</h2>
                <div class="box2-1-1">
                    <a href="#">
                        <img src="https://humic.co.kr/assets/images/icon/icon-call.png" style="width: 78px; height: 77px;" alt="">
                        <p style="color: white; font-size: 20px; font-weight: bold;">전화걸기</p>
                    </a>
                    <a href="#" style="display: block; text-align: center;">
                        <img src="https://humic.co.kr/assets/images/icon/icon-consult.png" style="width: 70px; height: 70px;" alt="">
                        <p style="color: white; font-size: 20px; font-weight: bold; margin: 6px;">전문의 상담</p>
                    </a>
                </div>
                <p style="font-size: 16px; color: white; line-height: 25px;">분야별 최고 수준의 전문의와 상담을 통해서 고민을 해결해보세요.</p>
            </div>
            <div class="box2-2">
                <h2 style="color: white; text-align: center; font-size: 28px; margin-bottom: 20px;">진료 예약</h2>
                <div class="box2-2-1">
                    <a href="#">
                        <img src="https://humic.co.kr/assets/images/icon/icon-calendar.png" style="width: 78px; height: 77px;" alt="">
                        <p style="color: white; font-size: 20px; font-weight: bold;">진료예약</p>
                    </a>
                    <a href="#" style="display: block; text-align: center;">
                        <img src="https://humic.co.kr/assets/images/icon/icon-map.png" style="width: 70px; height: 70px;" alt="">
                        <p style="color: white; font-size: 20px; font-weight: bold; margin: 6px;">오시는길</p>
                    </a>
                </div>
                <p style="font-size: 18px; color: white; line-height: 25px; display: flex; justify-content: space-between;">
                   평일
                    <span>09:00 ~ 18:00</span>
                </p>
                <p style="font-size: 18px; color: white; line-height: 25px; display: flex; justify-content: space-between; margin-top: 5px;">
                    토요일
                    <span>09:00 ~ 13:00</span>
                </p>
                <p style="font-size: 18px; color: white; line-height: 25px; display: flex; justify-content: space-between; margin-top: 5px;">공휴일/일요일 휴진</p>
            </div>
        </div>
    </div>
</body>
</html>
