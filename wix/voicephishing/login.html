<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script src="https://kit.fontawesome.com/2ff1512d45.js" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
    <div class="login-box">
        <div class="img-box">
            <img src="../img/logo.webp" alt="">
        </div>
        <div class="email">
            <input type="text" placeholder="전화번호,사용자 이름 또는 이메일">
        </div>
        <div class="pass">
            <input type="password" placeholder="비밀번호">
        </div>
        <div class="login-btn">
            <button class="btn">
                <span>로그인</span>
            </button>
        </div>
        <div class="bar">
            <div class="bar1"></div>
            <div class="text">
                <span>또는</span>
            </div>
            <div class="bar2"></div>
        </div>
        <div class="sns">
            <a href="#">
                <i class="fa-brands fa-google"></i>
                <span>구글</span>
                <span>계정으로</span>
                <span>로그인</span>
            </a>
        </div>
        <div class="pass-lost">
            <span><a href="#">비밀번호를 잊으셨나요?</a></span>
        </div>
        <div class="join-box">
            <span>계정이 없으신가요?</span>
            <span><a href="#">가입하기</a></span>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
