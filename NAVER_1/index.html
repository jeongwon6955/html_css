<!DOCTYPE html>
<html lang="en">
<head>

                </div>
            </div>
        </div>
        <div class="link1">

                <div class="ballon">
                네이버톡
                </div>
            </div>
            <div class="hover_box2" style="left: 70px;">
                <i class="fa-regular fa-bell"></i>
            </div>

                <div class="ballon" style="width: 70px; left: 65px;">

                </div>
            </div>
            <div class="hover_box1" style="left: 140px;">
                <i class="fa-solid fa-basket-shopping"></i>

                <div class="ballon" style="left: 115px;">
                장바구니

            </div>
