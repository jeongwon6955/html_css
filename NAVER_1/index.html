<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/2ff1512d45.js" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
    <section class="header">
        <div class="link">
            <input type="checkbox" id="hover">
            <label for="hover" class="hover" id="#tap">
                <i class="fa-solid fa-bars"></i>
            </label>
            <div class="tapmenu">
                <div class="title">
                    <h1>바로가기</h1>
                </div>
                <div class="user">

                </div>
            </div>
            <div class="tapmenu1"></div>
            <div class="ballon_box">
                <div class="ballon">
                바로가기
                </div>
            </div>
            <div class="hover_box1">
                <a href="https://nid.naver.com/nidlogin.login?svctype=262144&url=http%3A%2F%2Fnew-m.pay.naver.com%2Fpcpay">
                    <i class="fa-brands fa-amazon-pay"></i>
                </a> 
            </div>
            <div class="ballon_box1">
                <div class="ballon" style="width: 120px; left: 45px;">
                네이버페이
                </div>
            </div>
        </div>
        <div class="link1">
            <input type="checkbox" id="hover2">
            <label for="hover2" class="hover" id="tap1">
                <i class="fa-regular fa-comment-dots"></i>
            </label>
            <div class="tapmenu" style="left: -300px;"></div>
            <div class="tapmenu1"></div>
            <div class="ballon_box">
                <div class="ballon">
                네이버톡
                </div>
            </div>
            <input type="checkbox" id="hover3">
            <label for="hover3" class="hover2" style="left: 70px;" id="tap2">
                <i class="fa-regular fa-bell"></i>
            </label>
            <div class="tapmenu" style="left: -260px;"></div>
            <div class="tapmenu1"></div>
            <div class="ballon_box2">
                <div class="ballon" style="width: 70px; left: 65px;">
                알림
                </div>
            </div>
            <div class="hover_box2" style="left: 140px;">
               <a href="https://nid.naver.com/nidlogin.login?svctype=1&url=https%3A%2F%2Fshopping.naver.com%2Fcart&failUrl=https%3A%2F%2Fshopping.naver.com%2Fhome">
                   <i class="fa-solid fa-basket-shopping"></i>
               </a> 
            </div>
            <div class="ballon_box3">
                <div class="ballon" style="left: 115px;">
                장바구니
                </div>
            </div>
        </div>
    </section>
    <section class="search">
        <div class="searchbox">
            <div class="logo">
                <img src="https://lh6.googleusercontent.com/proxy/xWlGY8b6_3I-xmKeKVosNYX4RjmMGaMD61rOEnosQrTSMRGF0njuj2ni-tGqw1-_zLW6OsbuYiQrqyzf5-D6mmnWLPgjk9RzUXvf9MWb" alt="">
            </div>
            <div class="field">
                <input type="text">
                <div class="keyboard">
                    <i class="fa-solid fa-keyboard"></i>
                </div>
                <div class="ballon_box4">
                    <div class="ballon">입력 도구</div>
                </div>
                <input type="checkbox" id="search">
                <label for="search" class="t-btn">
                    <span>
                        <i class="fa-solid fa-caret-up"></i>
                    </span>
                    <span>
                        <i class="fa-solid fa-caret-down"></i>
                    </span>
                </label>
                <div class="sub"></div>
                <div class="search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
