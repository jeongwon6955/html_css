<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgslide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        ul {
            list-style: none;
        }
        .box {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }
        .slide {
            width: 400%;
            height: 300px;
            display: flex;
            animation: slide infinite linear 9s;
        }
        .slide div {
            width: 100%;
            height: 300px;
        }
        @keyframes slide {
            0% {
                transform: translateX(0);
            }
            23% {
                transform: translateX(0);
            }
            33% {
                transform: translateX(-1920px);
            }
            56% {
                transform: translateX(-1920px);
            }
            66% {
                transform: translateX(-3840px);
            }
            90% {
                transform: translateX(-3840px);
            }
            100% {
                transform: translateX(-5760px);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="slide">
            <div style="background-color: aquamarine;"></div>
            <div style="background-color: aqua;"></div>
            <div style="background-color: coral;"></div>
            <div style="background-color: aquamarine;"></div>
        </div>
    </div>
</body>
</html>
