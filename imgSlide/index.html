<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgslide</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }
        .slide {
            position: relative;
            width: 400%;
            height: 300px;
            display: flex;
            animation: slide infinite linear 6s;
        }
        .slide div {
            width: 100%;
            height: 300px;
        }
        @keyframes slide {
            0%{
                left: 0%
            }
            23%{ 
                left: 0%
            }
            33%{
                left: -100%
            }
            56%{
                left: -100%
            }
            66%{
                left: -200%
            }
            90%{
                left: -200%
            }
            100%{
                left: -300%
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="slide">
            <div style="background-color: aquamarine;"></div>
            <div style="background-color: aqua;"></div>
            <div style="background-color: coral;"></div>
            <div style="background-color: aquamarine;"></div>
        </div>
    </div>
</body>
</html>
