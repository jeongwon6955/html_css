<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .wrap {
            width: 100%;
        }
        .main {
            width: 100%;
            display: flex;
        }
        .header {
            width: 200px;
            height: 850px;
        }
        .logo {
            width: 100%;
            height: 150px;
            background-color: #E9F5DB;
        }
        .nav {
            width: 100%;
            height: 700px;
            background-color: black;
        }
        .contents {
            width: calc(100% - 200px);
            height: 850px;
        }
        .box1 {
            width: 100%;
            height: 400px;
            background-color: #87986A;
            position: relative;
        }
        .box1-1 {
            width: 100px;
            height: 95px;
            background-color: #E9F5DB;
            position: absolute;
            top: 0;
            right: 0;
            text-align: center;
            line-height: 90px;
            font-weight: bold;
        }
        .box1-2 {
            width: 100px;
            height: 95px;
            background-color: #E9F5DB;
            position: absolute;
            top: 95px;
            right: 0;
            border-top: 1px solid black;
            text-align: center;
            line-height: 90px;
            font-weight: bold;
        }
        .box1-3 {
            width: 100px;
            height: 95px;
            background-color: #E9F5DB;
            position: absolute;
            top: 190px;
            right: 0;
            border-top: 1px solid black;
            text-align: center;
            line-height: 90px;
            font-weight: bold;
        }
        .box2 {
            width: 100%;
            height: 200px;
            background-color: #E9F5DB;
        }
        .box3 {
            width: 100%;
            height: 250px;
            background-color: #87986A;
        }
        .footer {
            width: 100%;
            display: flex;
        }
        .footer1 {
            width: 200px;
            height: 100px;
            background-color: #E9F5DB;
        }
        .footer2 {
            width: calc(100% - 200px);
            display: flex;
        }
        .footer2-1 {
            width: 80%;
            height: 100px;
            background-color: #333;
        }
        .footer2-2 {
            width: 20%;
            height: 100px;
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="main">
            <div class="header">
                <div class="logo"></div>
                <div class="nav"></div>
            </div>
            <div class="contents">
                <div class="box1">
                    <div class="box1-1">
                        <p> 1 </p>
                    </div>
                    <div class="box1-2">
                        <p> 2 </p>
                    </div>
                    <div class="box1-3">
                        <p> 3 </p>
                    </div>
                </div>
                <div class="box2"></div>
                <div class="box3"></div>
            </div>
        </div>
        <div class="footer">
            <div class="footer1"></div>
            <div class="footer2">
                <div class="footer2-1"></div>
                <div class="footer2-2"></div>
            </div>
        </div>
    </div>
</body>
</html>
