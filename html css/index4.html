<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        li {
            list-style: none;
        }
        a {
            text-decoration: none;
            color: white;
        }
        .wrap {
            width: 1200px;
            margin: auto;
        }
        .nav {
            width: 1200px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: navy;
            margin-bottom: 50px;    
        }
        .nav > ul > li > a {
            padding: 25px;
        }
        .nav2 {
            width: 1200px;
            height: 100px;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            background-color: navy;
            margin-bottom: 50px;
            padding: 0 30px;
        }
        .nav2 > h1 {
            color: white;
        }
        .nav2 > ul > li > a {
            padding: 25px;
        }
        .nav3 {
            width: 1200px;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: navy;
            padding: 0 30px;
        }
        .nav3 > h1 {
            color: white;
        }
        .user {
            color: white;
        }
        .user > .box {
            width: 80px;
            border-radius: 20px;
            border: 2px solid white;
            display: flex;
        }
        .nav3 > ul > li > a {
            padding: 25px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="nav">
            <ul>
                <li class="menu">
                    <a href="#">menu1</a>
                    <a href="#">menu2</a>
                    <a href="#">menu3</a>
                    <a href="#">menu4</a>
                    <a href="#">menu5</a>
                </li>
            </ul>
        </div>
        <div class="nav2">
            <h1>logo</h1>
            <ul>
                <li class="menu">
                    <a href="#">menu1</a>
                    <a href="#">menu2</a>
                    <a href="#">menu3</a>
                    <a href="#">menu4</a>
                    <a href="#">menu5</a>
                </li>
            </ul>
        </div>
        <div class="nav3">
            <h1>logo</h1>
            <ul>
                <li class="menu">
                    <a href="#">menu1</a>
                    <a href="#">menu2</a>
                    <a href="#">menu3</a>
                    <a href="#">menu4</a>
                    <a href="#">menu5</a>
                </li>
            </ul>
            <div class="user">
                <div class="box">
                    <p style="padding-left: 10px;">=test=</p>
                    <p style="padding-left: 9px;">▾</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
