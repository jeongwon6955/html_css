<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dropdown1-1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #wrap {
            width: 100%;
        }
        li {
            list-style: none;
        }
        a {
            text-decoration: none;
            color: white;
        }
        h1 {
            color: white;
        }
        .header {
            width: 100%;
            height: 80px;
            background-color: black;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            align-items: center;
        }
        .menu {
            display: flex;
        }
        .menu > li {
            width: 150px;
            height: 80px;
            position: relative;
            text-align: center;
            line-height: 80px;
        }
        .submenu {
            position: absolute;
            background-color: black;
            width: 100%;
            height: 0px;
            overflow: hidden;
            transition: 600ms;
        }
        .menu > li:hover .submenu {
            height: 310px;
        }
        .menu > li:hover {
            background-color: #333;
        }
        .submenu > li:hover {
            background-color: #333;
        }
        .user a {
            margin-left: 16px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div class="header">
            <h1>Logo</h1>
            <ul class="menu">
                <li>
                    <a href="#">list1</a>
                    <ul class="submenu">
                        <li><a href="#">list1-1</a></li>
                        <li><a href="#">list1-2</a></li>
                        <li><a href="#">list1-3</a></li>
                        <li><a href="#">list1-4</a></li>
                    </ul>
                </li>
                <li>
                    <a href="#">list2</a>
                    <ul class="submenu">
                        <li><a href="#">list2-1</a></li>
                        <li><a href="#">list2-2</a></li>
                        <li><a href="#">list2-3</a></li>
                        <li><a href="#">list2-4</a></li>
                    </ul>
                </li>
                <li>
                    <a href="#">list3</a>
                    <ul class="submenu">
                        <li><a href="#">list3-1</a></li>
                        <li><a href="#">list3-2</a></li>
                        <li><a href="#">list3-3</a></li>
                        <li><a href="#">list3-4</a></li>
                    </ul>
                </li>
                <li>
                    <a href="#">list4</a>
                    <ul class="submenu">
                        <li><a href="#">list4-1</a></li>
                        <li><a href="#">list4-2</a></li>
                        <li><a href="#">list4-3</a></li>
                        <li><a href="#">list4-4</a></li>
                    </ul>
                </li>
            </ul>
            <div class="user">
                <a href="#">sign in</a>
                <a href="#">sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
