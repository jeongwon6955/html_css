<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>microsoft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li {
            list-style: none;
        }
        a {
            text-decoration: none;
            color: black;
        }
        #wrap {
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: center;
            height: 55px;
            width: 100%;
            align-items: center;
        }
        .menu {
            display: flex;
            width: 1100px;
            padding: 0 25px;
            height: 55px;
        }
        .menu > li {
            padding: 0 14px;
            height: 55px;
            line-height: 55px;
        }
        .menu > li > a {
            font-size: 13px;
        }
        .menu > li > a:hover {
            border-bottom: 2px solid black;
        }
        .user {
            width: 400px;
            height: 55px;
            line-height: 55px;
            display: flex;
        }
        .user > li > a {
            font-size: 13px;
        }
        .user > li > a:hover {
            border-bottom: 2px solid black;
        }
        .slider {
            width: 1920px;
            height: 600px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div class="header">
            <img src="https://cdn-dynmedia-1.microsoft.com/is/image/microsoftcorp/UHFbanner-MSlogo?fmt=png-alpha&bfc=off&qlt=100,1" style="width: 108px; height: 23px;" alt="microsoft">
            <ul class="menu">
                <li>
                    <a href="#">Microsoft 365</a>
                </li>
                <li>
                    <a href="#">Teams</a>
                </li>
                <li>
                    <a href="#">Copilot</a>
                </li>
                <li>
                    <a href="#">Windows</a>
                </li>
                <li>
                    <a href="#">Surface</a>
                </li>
                <li>
                    <a href="#">Xbox</a>
                </li>
                <li>
                    <a href="#">세일</a>
                </li>
                <li>
                    <a href="#">지원</a>
                </li>
            </ul>
            <div class="user">
                <li style="padding: 0 15px;"><a href="#">Microsoft 전체</a></li>
                <li style="padding: 0 15px;"><a href="#">검색</a></li>
                <li style="padding-left: 30px;"><a href="#">카트</a></li>
                <span style="padding: 0 15px; font-size: 13px;">로그인</span>
            </div>
        </div>
        <div class="slider">
            <img src="https://cdn-dynmedia-1.microsoft.com/is/image/microsoftcorp/Highlight-Surface-Pro-AI-11Ed-Sapphire-MC001-3000x1682:VP5-1920x600
            " alt="">
        </div>
    </div>
</body>
</html>
