<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        li {
            list-style: none;
            padding-left: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .wrap {
            width: 100%;
        }

        header {
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background-color: black;
            color: white;
        }

        .menu {
            display: flex;
        }

        .menu > li {
            position: relative;
            width: 120px;
            height: 80px;
            margin: 0 30px;
            text-align: center;
            line-height: 80px;
        }

        .submenu {
            position: absolute;
            width: 100%;
            overflow: hidden;
            background-color: black;
            color: gray;
            height: 0;
            transition: 0.5s;
        }

        .menu > li:hover .submenu {
            height: 320px;
        }

    </style>
</head>
<body>
    <div class="wrap">
        
        <header>
            <div class="logo">
                <h1>로고</h1>
            </div>

            <nav>
                <ul class="menu">
                    <li>
                        <a href="#">list1</a>
                        <ul class="submenu">
                            <li><a href="#">list1-1</a></li>
                            <li><a href="#">list1-2</a></li>
                            <li><a href="#">list1-3</a></li>
                            <li><a href="#">list1-4</a></li>
                        </ul>
                    </li>

                    <li>
                        <a href="#">list2</a>
                    </li>

                    <li>
                        <a href="#">list3</a>
                    </li>

                    <li>
                        <a href="#">list4</a>
                    </li>

                </ul>
            </nav>

            <div class="user">
                <a href="#">로그인</a>
                <a href="#">회원가입</a>
            </div>
        </header>

    </div>
</body>
</html>
