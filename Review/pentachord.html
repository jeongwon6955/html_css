<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pentachord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li {
            list-style-type: none;
        }
        a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .wrap {
            width: 100%;
        }
        .box {
            background-color: #252525;
            width: 100%;
            height: 60px;
        }
        .box1 {
            margin: 0 auto;
            display: flex;
            justify-content: left;
            width: 1920px;
            height: 60px;
            align-items: center;
            padding: 0 30px;
        }
        p {
            color: white;
            margin-right: 20px;
            font-size: 15px;
        }
        .header {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            align-items: center;
            border-bottom: 1px solid rgb(195, 195, 195);
        }
        .menu {
            display: flex;
        }
        .menu > li {
            padding: 0 45px;
            height: 100px;
            display: flex;
            align-items: center;
        }
        .menu > li:hover {
            border-bottom: 2px solid rgb(255, 196, 0);
        }
        .submenu {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            height: 0px;
            background-color: white;
        }

        .submenu > li {
            padding: 0 60px;
        }

        .menu > li:hover .submenu {
            height: 230px;
            border-bottom: 1px solid rgb(195, 195, 195);
        }
        .name {
            display: flex;
            justify-content: center;
            margin: 25px 0px;
        }
        .slider {
            width: 100%;
            height: 500px;
            background-color: lightyellow;
        }
        .user a {
            margin-left: 16px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box">
            <div class="box1">
                <p>21582 인천광역시 남구동 선수촌공원로 1 구월테크노밸리 D동 507-508호</p>
                <p>032) 247-3377</p>
            </div>
        </div>
        <div class="header">
            <img src="https://www.pentachord.com/user/images/common/logo.png" width="205" height="50" alt="팬타코드">
            <ul class="menu">
                <li>
                    <a href="#">ABOUT</a>
                    <ul class="submenu">
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu01-01.png" alt="팬타코드는?">
                            <span class="name">팬타코드는?</span>
                        </li>
                        <li><img src="https://www.pentachord.com/user/images/common/menu01-02.png" alt="조직">
                            <span class="name">조직</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu01-03.png" alt="오시는길">
                            <span class="name">오시는길</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu01-04.png" alt="문의">
                            <span class="name">문의</span>
                        </li>
                    </ul>
                </li>
                <li>
                    <a href="#">BUSINESS</a>
                    <ul class="submenu">
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu02-01.png" alt="사업분야">
                            <span class="name">사업분야</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu02-02.png" alt="경험">
                            <span class="name">경험</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu02-03.png" alt="혁신">
                            <span class="name">혁신</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu02-04.png" alt="고객사">
                            <span class="name">고객사</span>
                        </li>
                    </ul>
                </li>
                <li><a href="#">PORTFOLIO</a></li>
                <li>
                    <a href="#">PENTA NEWS</a>
                    <ul class="submenu">
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu04-01.png" alt="소식">
                            <span class="name">소식</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu04-02.png" alt="펜타SNS">
                            <span class="name">펜타SNS</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu04-03.png" alt="갤러리">
                            <span class="name">갤러리</span>
                        </li>
                    </ul>
                </li>
                <li>
                    <a href="#">SERVICE</a>
                    <ul class="submenu">
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu05-01.png" alt="K웨비나">
                            <span class="name">K웨비나</span>
                        </li>
                        <li>
                            <img src="https://www.pentachord.com/user/images/common/menu05-02.png" alt="큐트러스트SSL">
                            <span class="name">큐트러스터SSL</span>
                        </li>
                    </ul>
                </li>
            </ul>
            <div class="user">
                <a href="#">로그인</a>
                <a href="#">회원가입</a>
            </div>
        </div>
        <div class="slider"></div>

    </div>
</body>
</html>
