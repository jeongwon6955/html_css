<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dropdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
        }
        .header {
            background-color: black;
            padding-inline: 40px;
            display: flex;
            justify-content: space-between;
        }
        ul {
            display: flex;
            justify-content: center;
            list-style-type: none;
        }
        .dropdown {
            position: relative;
        }
        .dropdown-menu {
            display: inline-block;
            color: white;
            padding: 30px 60px;
        }
        .dropdown-menu:hover {
            background-color: #333;
        }
        .dropdown-content {
            position: absolute;
            height: 0;
            overflow: hidden;
            width: 100%;
            background-color: black;
            transition: 0.5s;
        }
        .dropdown-content a {
            text-decoration: none;
            text-align: center;
            display: block;
            color: white;
            padding: 15px 10px;
        }
        .dropdown:hover .dropdown-content {
            height: 200px;
        }
        .dropdown a:hover {
            background-color: #333;
        }
        h1 {
            color: white;
            line-height: 80px;
        }
        .user {
            justify-content: right;
        }
        .user > a{
            text-decoration: none;
            color: white;
            margin-left: 20px;
            line-height: 80px;
        }
    </style>
</head>
<body>
    <div id="warp">
        <div class="header">
            <h1>Logo</h1>
            <ul>
                <li class="dropdown">
                    <div class="dropdown-menu">list1</div>
                    <div class="dropdown-content">
                        <a href="#">list1-1</a>
                        <a href="#">list1-2</a>
                        <a href="#">list1-3</a>
                        <a href="#">list1-4</a>
                    </div>
                </li>
                <li class="dropdown">
                    <div class="dropdown-menu">list2</div>
                    <div class="dropdown-content">
                        <a href="#">list2-1</a>
                        <a href="#">list2-2</a>
                        <a href="#">list2-3</a>
                        <a href="#">list2-4</a>
                    </div>
                </li>
                <li class="dropdown">
                    <div class="dropdown-menu">list3</div>
                    <div class="dropdown-content">
                        <a href="#">list3-1</a>
                        <a href="#">list3-2</a>
                        <a href="#">list3-3</a>
                        <a href="#">list3-4</a>
                    </div>
                </li>
                <li class="dropdown">
                    <div class="dropdown-menu">list4</div>
                    <div class="dropdown-content">
                        <a href="#">list4-1</a>
                        <a href="#">list4-2</a>
                        <a href="#">list4-3</a>
                        <a href="#">list4-4</a>
                    </div>
                </li>
            </ul>
            <div class="user">
                <a href="#">sign in</a>
                <a href="#">sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
